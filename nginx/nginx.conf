server {
    listen 443 ssl http2;
    server_name rsalarda.works www.rsalarda.works;
    
    # SSL Certificates (Let's Encrypt via Certbot)
    ssl_certificate /etc/letsencrypt/live/rsalarda.works/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rsalarda.works/privkey.pem;
    
    # SSL Configuration (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # WebSocket configuration for Django Channels
    location /ws/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeouts (24 hours for long-lived connections)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
        
        # Disable buffering for real-time communication
        proxy_buffering off;
    }

    # HTTP and API traffic
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Let Django handle ALL CORS headers - don't interfere
        # Critical: proxy_pass_header ensures Django's CORS headers reach the client
        proxy_pass_header Access-Control-Allow-Origin;
        proxy_pass_header Access-Control-Allow-Credentials;
        proxy_pass_header Access-Control-Allow-Methods;
        proxy_pass_header Access-Control-Allow-Headers;
        proxy_pass_header Access-Control-Expose-Headers;
        
        # Increase timeouts for long-running requests
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        
        # Client body size (for file uploads)
        client_max_body_size 20M;
    }

    # Static files - redirect to S3
    location /static/ {
        # In production, this should redirect to your S3 bucket
        # Example: return 301 https://your-bucket.s3.amazonaws.com/static$request_uri;
        proxy_pass http://web:8000;
    }

    # Media files - redirect to S3
    location /media/ {
        # In production, this should redirect to your S3 bucket
        # Example: return 301 https://your-bucket.s3.amazonaws.com/media$request_uri;
        proxy_pass http://web:8000;
    }

    # Health check endpoint (no auth required)
    location /api/health/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        access_log off;
    }
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name rsalarda.works www.rsalarda.works;
    
    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
