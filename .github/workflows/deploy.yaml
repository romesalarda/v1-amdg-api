name: CI/CD

# PRs and pushes to main/staging run the test suite.
# A push to main that passes the tests deploys to EC2 (the image is built on the instance).

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

# Supersede stale PR runs, but never cancel a run on main: it may be mid-deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Throwaway services; nothing here is a real secret.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amdg_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: test-secret-key-for-ci-only-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      USE_POSTGRES: "True"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: amdg_test_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      USE_S3: "False"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://localhost:6379/1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CORS_ALLOW_ALL_ORIGINS: "False"
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      STRIPE_TEST_MODE: "True"
      # Fake values: tests mock the Stripe API but still need these to be non-empty
      STRIPE_SECRET_KEY_TEST: sk_test_ci_fake
      STRIPE_PUBLISHABLE_KEY_TEST: pk_test_ci_fake
      STRIPE_WEBHOOK_SECRET: whsec_ci_fake
      SENTRY_ENABLED: "False"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10" # keep in sync with the Dockerfile
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install Python dependencies
        # tblib lets --parallel workers report test tracebacks properly
        run: |
          pip install -r requirements.txt
          pip install tblib

      # Each worker gets its own cloned test database. If a test turns out not to be
      # parallel-safe, drop --parallel (slower, but sequential).
      - name: Run Django tests
        run: python manage.py test --parallel --noinput

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    env:
      AWS_REGION: eu-west-2
      APP_DIR: /home/ec2-user/v1-amdg-api
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Runs on the instance as root via SSM (no SSH, no open port 22). Git runs as
      # ec2-user so the checkout never becomes root-owned. The real work lives in
      # scripts/deploy.sh so it can also be run by hand.
      - name: Deploy to EC2 via SSM
        run: |
          PARAMS=$(jq -n --arg dir "$APP_DIR" --arg sha "$GITHUB_SHA" '{
            executionTimeout: ["1500"],
            commands: [
              "set -eu",
              "cd \($dir)",
              "runuser -u ec2-user -- git fetch --prune origin main",
              "runuser -u ec2-user -- git reset --hard \($sha)",
              "bash scripts/deploy.sh \($sha)"
            ]
          }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --parameters "$PARAMS" \
            --query Command.CommandId \
            --output text)
          echo "SSM command: $COMMAND_ID"

          STATUS=Pending
          for i in $(seq 1 150); do
            sleep 10
            # The invocation can briefly not exist right after send-command
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "[$i] $STATUS"
            case "$STATUS" in Success|Failed|Cancelled|Cancelling|TimedOut) break ;; esac
          done

          echo "=== stdout (last 24k chars) ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "=== stderr ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query StandardErrorContent --output text

          [ "$STATUS" = "Success" ] || { echo "Deploy ended with status: $STATUS"; exit 1; }
