# Local development docker-compose override
# This file is automatically used by docker-compose for local development
# It adds build contexts so you can develop without pushing to ECR

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: amdg-local:latest
    env_file:
      - .env
    ports:
      - "8000:8000"  # Expose for local access

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: amdg-local:latest
    env_file:
      - .env

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: amdg-local:latest
    env_file:
      - .env

  # Expose Postgres for local tools (optional)
  db:
    ports:
      - "5432:5432"

  # Expose Redis for local tools (optional)
  redis:
    ports:
      - "6379:6379"

  # Mailpit — local email catcher
  # SMTP: port 1025 (Django sends here)
  # Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: unless-stopped
